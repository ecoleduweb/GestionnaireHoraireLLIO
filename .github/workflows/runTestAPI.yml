name: Test BackEnd Go
on:
  pull_request:
    paths:
      - "API/**"

jobs:
  unit-testing:
    runs-on: ubuntu-latest

    env:
      DB_USER: testuser
      DB_PASSWORD: testpassword
      DB_ROOT_PASSWORD: rootpassword
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME_RUN: app_run
      DB_NAME_TEST: app_test

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: ${{ env.DB_ROOT_PASSWORD }}
          MARIADB_DATABASE: ${{ env.DB_NAME_TEST }}
          MARIADB_USER: ${{ env.DB_USER }}
          MARIADB_PASSWORD: ${{ env.DB_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install dependencies
        working-directory: API
        run: go mod tidy

      - name: Create env file
        working-directory: API
        run: |
          cat > .env << EOF
          DB_USER=${DB_USER}
          DB_PASSWORD=${DB_PASSWORD}
          DB_HOST=${DB_HOST}
          DB_PORT=${DB_PORT}
          DB_NAME_RUN=${DB_NAME_RUN}
          DB_NAME_TEST=${DB_NAME_TEST}
          ENV=TEST
          AZUREAD_CLIENT_ID=${{ secrets.AZUREAD_CLIENT_ID }}
          AZUREAD_CLIENT_SECRET=${{ secrets.AZUREAD_CLIENT_SECRET }}
          AZUREAD_CALLBACK_URL=${{ secrets.AZUREAD_CALLBACK_URL }}
          SESSION_MAX_AGE=${{ secrets.SESSION_MAX_AGE }}
          SESSION_SECRET=${{ secrets.SESSION_SECRET }}
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
          EOF

      - name: Prepare database
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

          # Create the second database and grant the app user access to both
          mariadb --no-defaults -uroot -p"${DB_ROOT_PASSWORD}" -h"${DB_HOST}" -P"${DB_PORT}" -e "
            CREATE DATABASE IF NOT EXISTS ${DB_NAME_RUN};
            GRANT ALL PRIVILEGES ON ${DB_NAME_RUN}.* TO '${DB_USER}'@'%';
            GRANT ALL PRIVILEGES ON ${DB_NAME_TEST}.* TO '${DB_USER}'@'%';
            FLUSH PRIVILEGES;"

          # Verify the connection as the app user
          mariadb --no-defaults -u"${DB_USER}" -p"${DB_PASSWORD}" -h"${DB_HOST}" -P"${DB_PORT}" "${DB_NAME_TEST}" \
            -e "SELECT 'Connection test successful';"

      - name: Run tests
        working-directory: API
        run: |
          echo "::group::Exécution des tests Go"
          go test -v ./tests/...
          TEST_EXIT_CODE=$?
          echo "::endgroup::"

          echo ""
          echo "=== Résumé des Tests ==="
          if [ $TEST_EXIT_CODE -eq 0 ]; then
            echo "✅ Tous les tests ont réussi! 🎉"
          else
            echo "❌ Certains tests ont échoué. Consultez les détails ci-dessus."
          fi

          # Extraction des résultats des tests pour un rapport plus détaillé
          echo ""
          echo "=== Détails des Tests ==="
          go test -v ./tests/... | grep -E "^=== RUN|^--- PASS|^--- FAIL" | while read -r line; do
            if [[ $line == *"=== RUN"* ]]; then
              TEST_NAME=$(echo $line | awk '{print $3}')
              echo -n "Test: $TEST_NAME - "
            elif [[ $line == *"--- PASS"* ]]; then
              DURATION=$(echo $line | awk '{print $4}')
              echo "✅ RÉUSSI ($DURATION)"
            elif [[ $line == *"--- FAIL"* ]]; then
              DURATION=$(echo $line | awk '{print $4}')
              echo "❌ ÉCHOUÉ ($DURATION)"
            fi
          done

          exit $TEST_EXIT_CODE